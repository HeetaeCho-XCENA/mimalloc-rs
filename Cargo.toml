# SPDX-License-Identifier: MIT
[package]
name = "mimalloc-rs"
version = "0.0.0"
edition = "2021"
rust-version = "1.84"          # MSRV: strict-provenance ptr APIs (addr/with_addr) stabilized in 1.84
license = "MIT"
authors = ["Heetae Cho"]
description = "A from-scratch Rust port of the mimalloc v3 general-purpose allocator (no_std core + std)."
repository = "https://github.com/HeetaeCho-XCENA/mimalloc-rs"
homepage = "https://github.com/HeetaeCho-XCENA/mimalloc-rs"
keywords = ["allocator", "malloc", "mimalloc", "no_std", "memory"]
categories = ["memory-management", "no-std"]
publish = false                # not yet published to crates.io (name TBD); depend via git for now

[features]
default = ["std"]
# Pull in `std` (thread_local!, OS threads). Core engine stays no_std-capable without it.
std = []
# Nightly-only: real `core::alloc::Allocator` + `#[thread_local]` fast path.
nightly = []
# Security hardening (encoded free lists + checks; mirrors MI_SECURE>=3).
secure = []
# Debug padding/canaries + extra invariant checks (mirrors MI_PADDING + MI_DEBUG).
debug = []
# Runtime statistics (mirrors mimalloc stats.c).
stats = []
# Valgrind/ASan tracking hooks (mirrors track.h); no-op when off.
track = []
# Export the C-ABI `mi_*` symbols (#[no_mangle] extern "C"); requires `std`.
# Off by default to avoid symbol clashes when used as an ordinary Rust crate.
capi = ["std"]
# Differential test harness against the C libmimalloc (set MIMALLOC_C_LIB).
differential = ["std"]
# Transparent malloc/free override (LD_PRELOAD). Exports the standard libc
# symbols (plain `malloc`/`free`/… — Phase N) plus the `mi_*` symbols, and routes
# foreign pointers (not allocated by us) to the real system allocator instead of
# leaking/aborting. Pulls in `capi` so the shared `mi_*` forwarding logic is
# always compiled in. Requires std. Off by default.
override = ["std", "capi"]

[dependencies]
# Stable `Allocator` trait. On nightly we additionally impl `core::alloc::Allocator`.
# `alloc` feature provides allocator-api2's own Box/Vec (used in tests/examples).
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

# Concurrency model checker — only linked when building with `--cfg loom`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
# Statistical micro-benchmarks (`benches/`). Minimal features (no plotters/rayon)
# to keep the dev dep tree small and MSRV-friendly; `cargo bench` still reports
# mean/median/CI/outliers and supports `--save-baseline`/`--baseline`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# MSRV pin: criterion → clap → clap_builder otherwise pulls `clap_lex 1.x`,
# which needs the `edition2024` Cargo feature (Rust ≥ 1.85) and breaks our 1.84
# MSRV (benches *are* built by `cargo test`). clap_builder bumped clap_lex to 1.x
# *within* the 4.5 patch line (4.5.40 uses edition2021 clap_lex 0.7; 4.5.61 uses
# 1.x), so an exact clap pin is required. Drop once the MSRV moves past 1.85.
clap = { version = "=4.5.40", default-features = false }

[[bench]]
name = "alloc"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# `--cfg loom` is set manually when running concurrency models.
# `--cfg override_export` is set (with --features override) only for the
# deliberately built LD_PRELOAD cdylib/staticlib; never by cargo test/build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(have_c_mimalloc)', 'cfg(override_export)'] }

[profile.release]
lto = true
codegen-units = 1
