# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Build + test on stable and the pinned MSRV. The `nightly` feature is
  # excluded here because it requires unstable compiler features.
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.84.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Build (default)
        run: cargo build
      - name: Build (no_std core)
        run: cargo build --no-default-features
      - name: Test (default)
        run: cargo test
      - name: Test (secure + debug + stats + track)
        run: cargo test --features secure,debug,stats,track

  # Nightly-only paths: the `core::alloc::Allocator` impl and #[thread_local].
  nightly:
    name: nightly (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo build --all-features
      - run: cargo test --features nightly

  # Formatting + lints.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Lint the stable-compatible feature surface too (hardening, stats).
      - run: cargo clippy --all-targets --features secure,debug,stats,track -- -D warnings

  # Undefined-behavior / strict-provenance checks on the pure-logic modules
  # (the OS-backed paths use real mmap and can't run under Miri).
  miri:
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --lib bitmap
      - run: cargo miri test --lib free_list
      - run: cargo miri test --lib layout
      - run: cargo miri test --lib bits

  # Concurrency model checking (bitmap CAS + xthread_free MPSC).
  loom:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib loom_tests

  # C-vs-rs differential: build the matching C `libmimalloc` (the tag MUST report
  # the same MI_MALLOC_VERSION the port targets, else `version_matches_c` fails)
  # and run the observable-contract differential — across all size bins, the
  # edge-case API surface, and the cross-thread workload.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C libmimalloc (v3.3.2 == MI_MALLOC_VERSION 30302)
        run: |
          git clone --depth 1 --branch v3.3.2 https://github.com/microsoft/mimalloc.git /tmp/mimalloc-c
          cmake -S /tmp/mimalloc-c -B /tmp/mimalloc-c/build \
            -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF \
            -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
          cmake --build /tmp/mimalloc-c/build --target mimalloc -j
          ls -l /tmp/mimalloc-c/build/libmimalloc.so*
      - name: Differential test against C
        run: cargo test --features differential --test differential
        env:
          MIMALLOC_C_LIB: /tmp/mimalloc-c/build

  # Fuzzing: a bounded AddressSanitizer smoke run of the alloc/free/realloc/
  # aligned op-stream target (`fuzz/`). Surfaces regressions without an unbounded
  # job; deeper fuzzing is run locally/out of band (`cargo +nightly fuzz run alloc`).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        # NB: not `--locked` — cargo-fuzz's pinned lockfile carries an old `rustix`
        # that fails to compile on current nightly; let cargo resolve a compatible one.
        # Clear the global `-D warnings` so a warning in the tool's own deps can't
        # fail the install (that code isn't ours to fix).
        run: cargo install cargo-fuzz
        env:
          RUSTFLAGS: ""
      - name: Smoke fuzz (bounded)
        run: cargo fuzz run alloc -- -runs=100000 -max_total_time=60

  # AddressSanitizer over the unit tests: out-of-bounds / use-after-free / leaks
  # in our unsafe code paths.
  asan:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test --lib --target x86_64-unknown-linux-gnu

  # ThreadSanitizer over the cross-thread stress tests: data races at real scale,
  # complementing the loom models. Needs build-std for accurate instrumentation.
  tsan:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=thread
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --lib --
          stress_owner_retire_vs_cross_thread_free
          cross_thread_free_collected_by_owner
          collect_reclaims_cross_thread_frees
          abandoned_pages_reclaimed_across_threads

  # Coverage report (informational; uploaded as an artifact).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        # Clear the global `-D warnings` for the third-party tool build (as above).
        run: cargo install cargo-llvm-cov
        env:
          RUSTFLAGS: ""
      - name: Coverage (lib)
        run: cargo llvm-cov --lib --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
